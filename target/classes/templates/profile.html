<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมาชิก - 3 Season Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="mobile-container p-3" style="padding-bottom: 90px !important;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-person-badge text-warning me-2"></i>ระบบสมาชิก 3 Season</h5>
        <span class="badge bg-warning text-dark rounded-pill px-3 py-2" th:text="'โต๊ะ ' + ${tableNumber}">โต๊ะ 1</span>
    </div>

    <!-- กรณีล็อกอินแล้ว -->
    <div th:if="${customer != null}" class="card border-0 shadow-sm rounded-4 p-4 text-center mb-3">
        <div class="bg-warning text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-2" style="width: 64px; height: 64px; font-size: 28px;">
            <i class="bi bi-person-check-fill"></i>
        </div>
        <h5 class="fw-bold mb-0" th:text="${customer.name}">ชื่อสมาชิก</h5>
        <div class="text-muted small mb-3" th:text="'เบอร์โทร: ' + ${customer.phone}">0812345678</div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="bg-light rounded-3 p-2">
                    <div class="small text-muted">คะแนนสะสม</div>
                    <div class="fs-4 fw-bold text-warning" th:text="${customer.points} + ' แต้ม'">0 แต้ม</div>
                </div>
            </div>
            <div class="col-6">
                <div class="bg-light rounded-3 p-2">
                    <div class="small text-muted">จำนวนที่สั่ง</div>
                    <div class="fs-4 fw-bold text-dark" th:text="${customer.totalOrders} + ' ครั้ง'">0 ครั้ง</div>
                </div>
            </div>
        </div>

        <a href="#" th:href="@{/customer/logout(table=${tableNumber})}" class="btn btn-outline-danger btn-sm rounded-pill px-4">ออกจากระบบ</a>
    </div>

    <!-- กรณียังไม่ล็อกอิน -->
    <div th:if="${customer == null}" class="card border-0 shadow-sm rounded-4 p-4 mb-3">
        <p class="small text-muted">กรอกเบอร์โทรศัพท์เพื่อเข้าสู่ระบบสะสมแต้ม (หากยังไม่เคยสมัคร ระบบจะสมัครให้อัตโนมัติ)</p>
        <form action="/customer/login" th:action="@{/customer/login}" method="post">
            <input type="hidden" name="tableNumber" th:value="${tableNumber}">
            <div class="mb-3">
                <label class="form-label small fw-bold">เบอร์โทรศัพท์ *</label>
                <input type="tel" name="phone" class="form-control rounded-pill" placeholder="08XXXXXXXX" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">ชื่อเล่น (สำหรับสมัครใหม่)</label>
                <input type="text" name="name" class="form-control rounded-pill" placeholder="เช่น คุณเอ">
            </div>
            <button type="submit" class="btn btn-warning w-100 rounded-pill fw-bold text-white py-2">เข้าสู่ระบบ / สมัครสมาชิก</button>
        </form>
    </div>

    <!-- ลิงก์ทางลัดสำหรับพนักงานและแอดมิน -->
    <div class="card border-0 bg-light rounded-4 p-3 text-center">
        <small class="text-muted d-block mb-2">สำหรับพนักงานและผู้จัดการร้าน</small>
        <div class="d-flex justify-content-center gap-2">
            <a href="/staff/queue" th:href="@{/staff/queue}" class="btn btn-outline-dark btn-sm rounded-pill px-3">หน้าจอครัว (KDS)</a>
            <a href="/admin/login" th:href="@{/admin/login}" class="btn btn-outline-warning text-dark btn-sm rounded-pill px-3">แอดมินร้าน</a>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="#" th:href="@{/(table=${tableNumber})}" class="nav-item-custom"><i class="bi bi-cup-straw"></i>สั่งอาหาร</a>
        <a href="#" th:href="@{/order-status(table=${tableNumber})}" class="nav-item-custom"><i class="bi bi-clipboard-check"></i>สถานะครัว</a>
        <a href="#" th:href="@{/payment(table=${tableNumber})}" class="nav-item-custom"><i class="bi bi-cash-stack"></i>ชำระเงิน</a>
        <a href="#" th:href="@{/profile(table=${tableNumber})}" class="nav-item-custom active"><i class="bi bi-person"></i>สมาชิก</a>
    </div>
</div>
</body>
</html>
