<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแลร้าน - 3 Season Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: linear-gradient(135deg, #ff6b00, #ff9a44); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="bg-warning text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px; font-size: 26px;">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h4 class="fw-bold mb-0">3 Season Admin</h4>
        <small class="text-muted">เข้าสู่ระบบจัดการร้านอาหารและลูกค้า</small>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small rounded-3 text-center" th:text="${error}">
        ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
    </div>

    <form action="/admin/login" th:action="@{/admin/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold">ชื่อผู้ใช้งาน (Username)</label>
            <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="Admin" required>
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold">รหัสผ่าน (Password)</label>
            <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn w-100 text-white fw-bold rounded-pill py-2 mb-3" style="background-color: #ff6b00;">
            เข้าสู่ระบบหลังร้าน
        </button>
        <div class="text-center">
            <a href="/" th:href="@{/}" class="text-muted small text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i> กลับหน้าร้านลูกค้า
            </a>
        </div>
    </form>
</div>

</body>
</html>
