<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบพนักงาน - 3 Season Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f4f6f9; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
        <div class="bg-dark text-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 55px; height: 55px;">
            <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h5 class="fw-bold mb-1">เข้าสู่ระบบพนักงาน / แอดมิน</h5>
        <small class="text-muted">3 Season Restaurant Management</small>
    </div>

    <div th:if="${error != null}" class="alert alert-danger py-2 small text-center rounded-3" th:text="${error}">
        Name หรือ Password ไม่ถูกต้อง
    </div>

    <form action="/staff/login" th:action="@{/staff/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold small">Name</label>
            <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="กรอก Name" required autofocus>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small">Password</label>
            <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="กรอก Password" required>
        </div>

        <button type="submit" class="btn btn-warning text-white fw-bold w-100 rounded-pill py-2 shadow-sm mb-3">
            เข้าสู่ระบบ
        </button>

        <div class="text-center">
            <a href="/" th:href="@{/}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> กลับหน้าสั่งอาหารลูกค้า
            </a>
        </div>
    </form>
</div>

</body>
</html>
