<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้าง QR Code ประจำโต๊ะ - 3 Season Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f8f9fa; }
        .topbar { background: linear-gradient(135deg, #ff6b00, #ff8800); color: white; padding: 16px 24px; }
        .qr-card { background: white; border-radius: 20px; padding: 20px; text-align: center; border: 2px dashed #ff8800; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="topbar d-flex flex-wrap justify-content-between align-items-center gap-2 no-print">
    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-qrcode me-2"></i>สร้าง QR Code สั่งอาหารประจำโต๊ะ</h5>
    <div class="d-flex gap-2">
        <a href="/admin/menus" th:href="@{/admin/menus}" class="btn btn-outline-light btn-sm rounded-pill px-3">จัดการเมนู</a>
        <a href="/admin/reports" th:href="@{/admin/reports}" class="btn btn-outline-light btn-sm rounded-pill px-3">รายงานยอดขาย</a>
        <button onclick="window.print()" class="btn btn-light btn-sm rounded-pill px-3 fw-bold text-dark">
            <i class="fa-solid fa-print me-1"></i> พิมพ์ป้าย QR
        </button>
    </div>
</div>

<div class="container py-4">
    <form action="/admin/qrcodes" th:action="@{/admin/qrcodes}" method="get" class="d-flex align-items-center gap-2 mb-4 no-print">
        <label class="fw-bold small">จำนวนโต๊ะทั้งหมด:</label>
        <input type="number" name="totalTables" th:value="${totalTables}" min="1" max="50" class="form-control form-control-sm w-auto rounded-pill px-3">
        <button type="submit" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold">สร้าง QR</button>
    </form>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="t : ${#numbers.sequence(1, totalTables)}">
            <div class="qr-card shadow-sm">
                <div class="fw-bold text-warning">3 SEASON RESTAURANT</div>
                <h4 class="fw-bold my-1" th:text="'โต๊ะ ' + ${t}">โต๊ะ 1</h4>
                <img th:src="'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=http://localhost:8080/?table=' + ${t}"
                     alt="Table QR" class="my-2 rounded-3">
                <div class="small text-muted">สแกนเพื่อเปิดเมนูและสั่งอาหาร</div>
                <a href="#" th:href="@{/(table=${t})}" target="_blank" class="btn btn-sm btn-outline-warning text-dark rounded-pill mt-2 no-print">
                    ทดลองเปิดลิงก์โต๊ะนี้
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
