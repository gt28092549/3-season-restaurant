<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - 3 Season Restaurant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-toggle-btn {
            border: none;
            background: none;
            font-weight: bold;
            color: #777;
            padding: 8px 16px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .auth-toggle-btn.active {
            color: #ff6b00;
            border-bottom: 2px solid #ff6b00;
        }
        .form-control-custom {
            border-radius: 12px;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
        }
        .form-control-custom:focus {
            background-color: #fff;
            border-color: #ff6b00;
            box-shadow: 0 0 0 0.25rem rgba(255, 107, 0, 0.15);
        }
    </style>
</head>
<body>

<div class="mobile-container p-3">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-warning text-white p-2 rounded-circle d-flex align-items-center justify-content-center" style="width:35px; height:35px;">
                <i class="bi bi-cutlery"></i>
            </div>
            <strong class="fs-6">3 Seaso...</strong>
        </div>
        <button class="btn btn-sm btn-outline-warning text-dark border rounded-pill px-3">
            <i class="bi bi-geo-alt text-warning me-1"></i> โต๊ะ <i class="bi bi-chevron-down ms-1"></i>
        </button>
        <div class="d-flex align-items-center gap-2">
            <span class="text-secondary small"><i class="bi bi-bell"></i> เรียกพนักงาน</span>
            <div class="bg-dark text-white p-2 rounded-3">
                <i class="bi bi-bag"></i>
            </div>
        </div>
    </div>

    <!-- Auth Card Container -->
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <!-- Tab Selector Switcher -->
        <div class="d-flex justify-content-center gap-3 border-bottom mb-4">
            <button id="tabLoginBtn" class="auth-toggle-btn active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
            <button id="tabSignupBtn" class="auth-toggle-btn" onclick="switchTab('signup')">สมัครสมาชิก</button>
        </div>

        <!-- 1. Form เข้าสู่ระบบ (Login) -->
        <form id="loginForm" onsubmit="handleAuth(event, 'login')">
            <div class="text-center mb-4">
                <h5 class="fw-bold">ยินดีต้อนรับกลับมา!</h5>
                <p class="text-muted small">กรอกเบอร์โทรศัพท์หรืออีเมลเพื่อสะสมแต้ม</p>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">อีเมล / เบอร์โทรศัพท์</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control form-control-custom border-start-0 rounded-end-3" placeholder="08X-XXX-XXXX หรือ email@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control form-control-custom border-start-0 rounded-end-3" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-end mb-4">
                <a href="#" class="text-warning small text-decoration-none">ลืมรหัสผ่าน?</a>
            </div>

            <button type="submit" class="btn text-white fw-bold w-100 py-2 rounded-pill shadow-sm" style="background: linear-gradient(90deg, #ff6b00, #ff4500);">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- 2. Form สมัครสมาชิก (Sign Up) -->
        <form id="signupForm" style="display: none;" onsubmit="handleAuth(event, 'signup')">
            <div class="text-center mb-4">
                <h5 class="fw-bold">สร้างบัญชีสมาชิก</h5>
                <p class="text-muted small">สมัครสมาชิกวันนี้เพื่อรับส่วนลดพิเศษ</p>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">ชื่อ-นามสกุล</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-person-vcard text-muted"></i></span>
                    <input type="text" class="form-control form-control-custom border-start-0 rounded-end-3" placeholder="สมชาย ใจดี" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">เบอร์โทรศัพท์</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-phone text-muted"></i></span>
                    <input type="tel" class="form-control form-control-custom border-start-0 rounded-end-3" placeholder="08X-XXX-XXXX" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control form-control-custom border-start-0 rounded-end-3" placeholder="กำหนดรหัสผ่าน 6 หลักขึ้นไป" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn text-white fw-bold w-100 py-2 rounded-pill shadow-sm mt-2" style="background: linear-gradient(90deg, #ff6b00, #ff4500);">
                ยืนยันการสมัครสมาชิก
            </button>
        </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="/" class="nav-item-custom">
            <i class="bi bi-cup-straw"></i>
            สั่งอาหาร
        </a>
        <a href="/order-status" class="nav-item-custom">
            <i class="bi bi-clipboard-check"></i>
            สถานะครัว
        </a>
        <a href="/payment" class="nav-item-custom">
            <i class="bi bi-cash-stack"></i>
            ชำระเงิน
        </a>
        <a href="/profile" class="nav-item-custom active">
            <i class="bi bi-person"></i>
            ล็อกอิน
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function switchTab(type) {
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabSignupBtn = document.getElementById('tabSignupBtn');

        if (type === 'login') {
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            tabLoginBtn.classList.add('active');
            tabSignupBtn.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            tabSignupBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
        }
    }

    function handleAuth(event, type) {
    event.preventDefault();
    
    localStorage.setItem('isLoggedIn', 'true');
    
    if (type === 'signup') {
        // ดึงชื่อที่ผู้ใช้พิมพ์ในช่องสมัครสมาชิก
        const nameInput = document.querySelector('#signupForm input[type="text"]').value;
        const userName = nameInput.trim() !== "" ? nameInput : "คุณสมาชิก";
        
        localStorage.setItem('userName', userName);
        localStorage.setItem('orderCount', '0');
        localStorage.setItem('userPoints', '0');
        
        alert("สมัครสมาชิกเรียบร้อยแล้ว! ยินดีต้อนรับ คุณ " + userName);
    } else {
        // กรณีเข้าสู่ระบบ
        const emailOrPhone = document.querySelector('#loginForm input[type="text"]').value;
        
        // ถ้ายังไม่มีชื่อในระบบ ให้ตั้งชื่อตามข้อมูลที่กรอกเข้ามา
        if (!localStorage.getItem('userName')) {
            const defaultName = emailOrPhone.split('@')[0] || "คุณสมาชิก";
            localStorage.setItem('userName', defaultName);
            localStorage.setItem('orderCount', '0');
            localStorage.setItem('userPoints', '0');
        }
        
        alert("เข้าสู่ระบบเรียบร้อยแล้ว!");
    }
    
    // พาไปยังหน้าโปรไฟล์
    window.location.href = "/profile";
}
</script>
</body>
</html>
